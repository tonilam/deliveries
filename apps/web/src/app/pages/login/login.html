<section class="auth">
  <h1>Sign in</h1>
  <p class="lede">Use your email and password, or continue with SSO.</p>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    <button type="submit" class="primary" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <div class="divider"><span>or</span></div>

  <div class="sso">
    <button type="button" class="secondary" (click)="sso('google')">Continue with Google</button>
    <button type="button" class="secondary" (click)="sso('apple')">Continue with Apple</button>
  </div>

  <p class="footer">
    New here?
    <a routerLink="/register">Create an account</a>
  </p>
</section>
