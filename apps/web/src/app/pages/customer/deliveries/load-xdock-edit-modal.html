<div class="modal-backdrop" (click)="cancel()"></div>
<div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="xdock-edit-title">
  <h2 id="xdock-edit-title">Edit X Dock #{{ load().id }}</h2>

  @if (error()) {
    <p class="modal__error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-stack">
    <ui-autocomplete-field
      label="X dock address"
      [query]="addressState('x_dock_xdock').query"
      [menuOpen]="addressState('x_dock_xdock').menuOpen"
      [options]="addressState('x_dock_xdock').options"
      optionLabelKey="label"
      clearAriaLabel="Clear X dock address"
      placeholder="Search or pick from list"
      (queryInput)="onAddressQueryInput('x_dock_xdock', $event)"
      (fieldFocus)="onAddressFocus('x_dock_xdock')"
      (fieldBlur)="onAddressBlur('x_dock_xdock')"
      (cleared)="clearAddressPicker('x_dock_xdock')"
      (optionSelected)="selectAddress('x_dock_xdock', $any($event))"
    />

    <ui-autocomplete-field
      label="Final delivery address"
      [query]="addressState('x_dock_delivery').query"
      [menuOpen]="addressState('x_dock_delivery').menuOpen"
      [options]="addressState('x_dock_delivery').options"
      optionLabelKey="label"
      clearAriaLabel="Clear final delivery address"
      placeholder="Search or pick from list"
      (queryInput)="onAddressQueryInput('x_dock_delivery', $event)"
      (fieldFocus)="onAddressFocus('x_dock_delivery')"
      (fieldBlur)="onAddressBlur('x_dock_delivery')"
      (cleared)="clearAddressPicker('x_dock_delivery')"
      (optionSelected)="selectAddress('x_dock_delivery', $any($event))"
    />

    <ui-autocomplete-field
      label="Secondary provider"
      [query]="partyState().query"
      [menuOpen]="partyState().menuOpen"
      [options]="partyState().options"
      optionLabelKey="business_name"
      clearAriaLabel="Clear secondary provider"
      placeholder="Search or pick from list"
      (queryInput)="onPartyQueryInput($event)"
      (fieldFocus)="onPartyFocus()"
      (fieldBlur)="onPartyBlur()"
      (cleared)="clearPartyPicker()"
      (optionSelected)="selectParty($any($event))"
    />

    <app-load-schedule-fields [form]="form" />

    <label>
      Pallet count
      <input type="number" formControlName="pallet_count" min="0" step="1" inputmode="numeric" />
    </label>

    <div class="modal__actions">
      <button type="button" class="btn btn--ghost" [disabled]="submitting()" (click)="cancel()">
        Cancel
      </button>
      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        {{ submitting() ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>

  <app-load-activity-panel [loadId]="load().id" [refreshToken]="activityRefresh()" />
</div>
