<section class="portal">
  <p class="back">
    <a routerLink="/app/addresses">← Addresses</a>
  </p>
  <h1>Add address</h1>
  <p class="lede">Save a collection or delivery location for your account.</p>

  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="create-form">
    <fieldset class="type-fieldset">
      <legend>Type</legend>
      <label class="radio">
        <input type="radio" formControlName="type" value="collection" />
        Collection
      </label>
      <label class="radio">
        <input type="radio" formControlName="type" value="delivery" />
        Delivery
      </label>
    </fieldset>

    <label>
      Business name
      <input type="text" formControlName="business_name" autocomplete="organization" />
    </label>

    <label>
      Address
      <input type="text" formControlName="address" autocomplete="street-address" />
    </label>

    <label>
      Zone
      <input type="text" formControlName="zone" autocomplete="address-level2" />
    </label>

    <label>
      State
      <select formControlName="state" autocomplete="address-level1">
        <option value="" disabled>Select a state</option>
        @for (state of stateOptions(); track state.code) {
          <option [value]="state.code">{{ state.name }}</option>
        }
      </select>
    </label>

    <label>
      Postcode
      <input type="text" formControlName="postcode" autocomplete="postal-code" />
    </label>

    <div class="actions">
      <a routerLink="/app/addresses" class="btn btn--ghost">Cancel</a>
      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        @if (submitting()) {
          Saving…
        } @else {
          Save address
        }
      </button>
    </div>
  </form>
</section>
