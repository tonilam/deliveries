@if (row) {
  <label class="active-cell checkbox">
    <input
      type="checkbox"
      [checked]="row.active"
      (click)="$event.stopPropagation()"
      (change)="onChange($event)"
      [attr.aria-label]="'Active: ' + row.name"
    />
    <span class="visually-hidden">{{ row.active ? 'Active' : 'Inactive' }}</span>
  </label>
}
