@if (actions().length > 0) {
  <div class="grid-actions">
    <button
      type="button"
      class="grid-actions__trigger"
      [attr.aria-expanded]="menuOpen()"
      aria-haspopup="menu"
      (click)="toggleMenu($event)"
    >
      Actions
    </button>
    @if (menuOpen()) {
      <div class="grid-actions__menu" role="menu">
        @for (action of actions(); track action.id) {
          <button
            type="button"
            class="grid-actions__item"
            role="menuitem"
            (click)="runAction(action, $event)"
          >
            {{ action.label }}
          </button>
        }
      </div>
    }
  </div>
}
