<section class="portal portal--wide">
  <h1>User management</h1>
  <p class="lede">Review admin and customer accounts and whether they are active.</p>

  <div class="tabs" role="tablist" aria-label="User lists">
    <button
      type="button"
      role="tab"
      class="tabs__tab"
      id="tab-admin"
      [attr.aria-selected]="activeTab() === 'admin'"
      [class.tabs__tab--active]="activeTab() === 'admin'"
      (click)="selectTab('admin')"
    >
      Admin users
    </button>
    <button
      type="button"
      role="tab"
      class="tabs__tab"
      id="tab-customer"
      [attr.aria-selected]="activeTab() === 'customer'"
      [class.tabs__tab--active]="activeTab() === 'customer'"
      (click)="selectTab('customer')"
    >
      Customer users
    </button>
  </div>

  @if (error()) {
    <p class="users-error" role="alert">{{ error() }}</p>
  }

  <div
    class="tab-panel"
    role="tabpanel"
    [attr.aria-labelledby]="activeTab() === 'admin' ? 'tab-admin' : 'tab-customer'"
  >
    <ag-grid-angular
      class="users-grid"
      [theme]="theme"
      [rowData]="rowData()"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [loading]="loading()"
    />
  </div>
</section>
