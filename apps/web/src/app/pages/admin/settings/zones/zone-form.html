<p class="back">
  <a routerLink="/admin/settings/zones">← Zones</a>
</p>
<h2>Add zone</h2>
<p class="lede">City or urban-area name and code for a country.</p>

@if (error()) {
  <p class="form-error" role="alert">{{ error() }}</p>
}

@if (loading()) {
  <p>Loading…</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" class="create-form">
    <label>
      <span class="label-text">Country <span class="required" aria-hidden="true">*</span></span>
      <select formControlName="country_id">
        @for (country of countries(); track country.id) {
          <option [ngValue]="country.id">{{ country.name }} ({{ country.code }})</option>
        }
      </select>
    </label>

    <label>
      <span class="label-text">Name <span class="required" aria-hidden="true">*</span></span>
      <input type="text" formControlName="name" autocomplete="off" />
    </label>

    <label>
      <span class="label-text">Code <span class="required" aria-hidden="true">*</span></span>
      <input
        type="text"
        formControlName="code"
        autocomplete="off"
        spellcheck="false"
        aria-describedby="zone-code-hint"
      />
    </label>
    <p id="zone-code-hint" class="field-hint">
      Uppercase letters and numbers, e.g. BNE for Brisbane.
    </p>

    <label class="checkbox">
      <input type="checkbox" formControlName="is_active" />
      <span class="label-text">Active</span>
    </label>

    <div class="actions">
      <a routerLink="/admin/settings/zones" class="btn btn--ghost">Cancel</a>
      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        @if (submitting()) {
          Saving…
        } @else {
          Save zone
        }
      </button>
    </div>
  </form>
}
