<section class="portal">
  <h1>Admin portal</h1>
  <p class="lede">System administration (placeholder).</p>
  @if (user(); as u) {
    <p class="lede">
      Signed in as <strong>{{ u.name }}</strong>.
    </p>
  }
  <nav>
    <a routerLink="/admin">Home</a>
    <a routerLink="/admin/settings">System settings</a>
    <a routerLink="/admin/users">User management</a>
  </nav>
  <div class="actions">
    <button type="button" (click)="logout()">Sign out</button>
  </div>
</section>
