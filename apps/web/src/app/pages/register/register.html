<section class="auth">
  <h1>Create account</h1>
  <p class="lede">Register with email and password, or continue with SSO.</p>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Name
      <input type="text" formControlName="name" autocomplete="name" />
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>
    <label>
      Confirm password
      <input type="password" formControlName="password_confirmation" autocomplete="new-password" />
    </label>
    <button type="submit" class="primary" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create account' }}
    </button>
  </form>

  <div class="divider"><span>or</span></div>

  <div class="sso">
    <button type="button" class="secondary" (click)="sso('google')">Continue with Google</button>
    <button type="button" class="secondary" (click)="sso('apple')">Continue with Apple</button>
  </div>

  <p class="footer">
    Already have an account?
    <a routerLink="/login">Sign in</a>
  </p>
</section>
