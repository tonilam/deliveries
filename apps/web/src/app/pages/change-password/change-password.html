<section class="auth">
  <h1>Change your password</h1>
  <p class="lede">Your administrator requires you to choose a new password before continuing.</p>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Current (temporary) password
      <input type="password" formControlName="current_password" autocomplete="current-password" />
    </label>
    <label>
      New password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>
    <label>
      Confirm new password
      <input type="password" formControlName="password_confirmation" autocomplete="new-password" />
    </label>
    <button type="submit" class="primary" [disabled]="submitting()">
      {{ submitting() ? 'Updating…' : 'Update password' }}
    </button>
  </form>
</section>
