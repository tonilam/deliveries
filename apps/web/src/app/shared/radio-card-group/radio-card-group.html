<fieldset
  class="radio-card-group"
  [class.radio-card-group--disabled]="isDisabled"
  [class.radio-card-group--inline]="inline()"
>
  @if (legend(); as legendText) {
    <legend class="radio-card-group__legend">{{ legendText }}</legend>
  }
  <div
    class="radio-card-group__options"
    [class.radio-card-group__options--inline]="inline()"
    role="radiogroup"
    [attr.aria-label]="legend() ?? null"
  >
    @for (option of options(); track option.value) {
      <label
        class="radio-card"
        [class.radio-card--selected]="isSelected(option.value)"
        [class.radio-card--disabled]="isOptionDisabled(option)"
      >
        <input
          type="radio"
          class="radio-card__input"
          [attr.name]="legend() ?? 'radio-card-group'"
          [value]="option.value"
          [checked]="isSelected(option.value)"
          [disabled]="isOptionDisabled(option)"
          (change)="select(option)"
        />
        <span class="radio-card__body">
          <span class="radio-card__label">{{ option.label }}</span>
          @if (option.description) {
            <span class="radio-card__description">{{ option.description }}</span>
          }
        </span>
      </label>
    }
  </div>
</fieldset>
