<div class="shell">
  <aside class="shell__sidebar" aria-label="Main menu">
    <div class="shell__brand">Loadplanner</div>
    <nav class="shell__nav">
      @for (item of navItems(); track item.path) {
        <a
          class="shell__nav-link"
          [routerLink]="item.path"
          routerLinkActive="shell__nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.exact === true }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="shell__right">
    <header class="shell__topbar">
      <div class="shell__topbar-end">
        @if (user(); as u) {
          <div class="shell__user-menu">
            <button
              type="button"
              [class]="impersonating() ? 'shell__view-as' : 'shell__avatar'"
              [attr.aria-expanded]="menuOpen()"
              aria-haspopup="menu"
              [attr.aria-label]="
                impersonating()
                  ? 'Account menu while viewing as ' + u.name
                  : 'Account menu for ' + u.name
              "
              (click)="toggleMenu($event)"
            >
              @if (impersonating()) {
                <span>View as {{ u.name }}</span>
              } @else {
                <span aria-hidden="true">{{ initials() }}</span>
              }
            </button>

            @if (menuOpen()) {
              <div class="shell__dropdown" role="menu">
                <a
                  class="shell__dropdown-item"
                  role="menuitem"
                  [routerLink]="profilePath()"
                  (click)="closeMenu()"
                >
                  My Profile
                </a>
                @if (impersonating()) {
                  <button
                    type="button"
                    class="shell__dropdown-item"
                    role="menuitem"
                    [disabled]="leavingImpersonation()"
                    (click)="leaveImpersonation()"
                  >
                    Return to admin
                  </button>
                }
                <button
                  type="button"
                  class="shell__dropdown-item shell__dropdown-item--button"
                  role="menuitem"
                  (click)="logout()"
                >
                  Sign Out
                </button>
              </div>
            }
          </div>
        }
      </div>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
