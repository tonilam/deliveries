services:
  mysql:
    image: mysql:8.4
    platform: linux/arm64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: loadplanner
      MYSQL_USER: loadplanner
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: php:8.3-cli-bookworm
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:4200
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loadplanner
      DB_USERNAME: loadplanner
      DB_PASSWORD: secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends
      git unzip libzip-dev libpng-dev libicu-dev
      && docker-php-ext-install pdo_mysql zip intl
      && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      && composer install --no-interaction
      && php artisan key:generate --force --no-interaction || true
      && php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    profiles: ["full"]

volumes:
  mysql_data:
